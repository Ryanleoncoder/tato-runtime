[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tato-runtime"
version = "0.1.0"
description = "The hands of an AI agent: computer and browser use for any agent that speaks MCP."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pillow>=10",
    "httpx>=0.27",
    "starlette>=0.37",
    "uvicorn[standard]>=0.29",
    "comtypes>=1.4; sys_platform == 'win32'",
    "python-xlib>=0.33; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["tato*"]

[tool.setuptools.package-data]
tato = ["ferramentas.json", "instrucoes.md", "extensao/*.js", "extensao/*.json", "extensao/*.html", "extensao/*.md", "extensao/icones/*.png"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
